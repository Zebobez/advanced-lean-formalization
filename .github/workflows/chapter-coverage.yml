name: Verify textbook chapter coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every manuscript chapter to have a Lean module
        run: python3 scripts/check_chapter_coverage.py --strict
